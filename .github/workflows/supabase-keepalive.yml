name: Supabase keep-alive

# El plan Free de Supabase pausa los proyectos con poca actividad en una
# ventana de 7 dias. La metrica NO es la brecha entre corridas: la doc pide
# "a few user requests to the database each day over the previous week", o sea
# actividad DIARIA.
#
# La version anterior corria lunes y jueves razonando que la brecha maxima de
# 4 dias quedaba bajo el limite de 7. No alcanzo: el 03-09-2026 el ping salio
# OK y el 07-09-2026 el proyecto ya estaba pausado. De ahi las 3 corridas
# diarias de abajo.
#
# Ademas, GitHub deshabilita los workflows programados tras 60 dias sin
# actividad en el repositorio, y atrasa o se salta corridas cuando la cola
# esta cargada. Con 3 por dia, perder alguna es inocuo.

on:
  schedule:
    # 05:17, 13:17 y 21:17 UTC todos los dias.
    - cron: '17 5,13,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La logica vive en scripts/supabase-keepalive.sh para poder probarla
      # en local sin pasar por Actions. Codigos de salida:
      #   2 = proyecto pausado (no resuelve el DNS) -> hay que restaurarlo a mano
      #   3 = configuracion mala (secrets, key rotada, tabla inexistente)
      #   1 = fallo transitorio tras agotar reintentos
      - name: Consultar la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: ./scripts/supabase-keepalive.sh

      # Corre con if: always() a proposito. Antes era un paso normal, asi que
      # cuando el ping fallaba este no se ejecutaba y se caia justo la
      # proteccion contra los 60 dias que apagan el cron: exactamente cuando
      # mas se necesita.
      - name: Marcar actividad en el repositorio
        if: always()
        run: |
          set -euo pipefail

          # Commiteamos solo si el ultimo commit ya paso los 30 dias, para no
          # llenar el historial de ruido.
          ultimo=$(git log -1 --format=%ct)
          ahora=$(date -u +%s)
          dias=$(( (ahora - ultimo) / 86400 ))
          echo "Ultimo commit hace ${dias} dias."

          if [ "${dias}" -lt 30 ]; then
            echo "El repo tuvo actividad reciente. No hace falta commitear."
            exit 0
          fi

          mkdir -p .github
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/keepalive-last-run.txt

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/keepalive-last-run.txt

          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
            exit 0
          fi

          git commit -m 'chore(keepalive): marca de actividad para no apagar el cron'
          git push
