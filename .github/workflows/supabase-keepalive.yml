name: Supabase keep-alive

# El plan Free de Supabase pausa un proyecto tras ~7 dias sin trafico real
# a la API/base de datos. Este job hace una consulta real a Postgres dos veces
# por semana para que ChileAirsoft_QA nunca llegue a esa ventana.
#
# Ademas, GitHub deshabilita los workflows programados tras 60 dias sin
# actividad en el repositorio. Por eso el segundo paso deja un commit de
# marca cuando el repo lleva mas de 30 dias quieto.

on:
  schedule:
    # Lunes y jueves a las 13:17 UTC (~09:17 / 10:17 en Chile).
    # Dos corridas por semana => la brecha maxima es de 4 dias, bajo el
    # limite de 7. Si GitHub atrasa o se salta una, la otra cubre.
    - cron: '17 13 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consultar la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "::error::Faltan los secrets SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

          # 3 intentos: si el proyecto estaba pausado o recien despertando,
          # la primera llamada puede fallar mientras Postgres levanta.
          for intento in 1 2 3; do
            code=$(curl -sS -o /tmp/keepalive.json -w '%{http_code}' -m 30 \
              "${SUPABASE_URL}/rest/v1/events?select=*&limit=1" \
              -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
              -H "Accept: application/json") || code=000
            echo "Intento ${intento}: HTTP ${code}"
            if [ "${code}" = "200" ]; then
              echo "Base de datos despierta y respondiendo."
              exit 0
            fi
            head -c 500 /tmp/keepalive.json || true
            echo
            sleep 30
          done

          echo "::error::El keep-alive no obtuvo HTTP 200. Revisa si el proyecto quedo pausado en https://supabase.com/dashboard/project/grbcgggbzjsmoivsdlxf"
          exit 1

      - name: Marcar actividad en el repositorio
        run: |
          set -euo pipefail

          # Los workflows programados se apagan tras 60 dias sin actividad en
          # el repo. Commiteamos solo si el ultimo commit ya paso los 30 dias,
          # para no llenar el historial de ruido.
          ultimo=$(git log -1 --format=%ct)
          ahora=$(date -u +%s)
          dias=$(( (ahora - ultimo) / 86400 ))
          echo "Ultimo commit hace ${dias} dias."

          if [ "${dias}" -lt 30 ]; then
            echo "El repo tuvo actividad reciente. No hace falta commitear."
            exit 0
          fi

          mkdir -p .github
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/keepalive-last-run.txt

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/keepalive-last-run.txt

          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
            exit 0
          fi

          git commit -m 'chore(keepalive): marca de actividad para no apagar el cron'
          git push
